# CoinUp Card Room API — Fly.io dual-deploy target
#
#   cd server && fly auth login
#   fly apps create coinup-card-room-api
#   fly secrets set SESSION_SECRET="$(openssl rand -hex 32)"
#   fly deploy
#
# App URL: https://coinup-card-room-api.fly.dev

app = "coinup-card-room-api"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8787"
  PAYMENTS_MODE = "mock"
  CORS_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000,https://bryanxbt.github.io"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
