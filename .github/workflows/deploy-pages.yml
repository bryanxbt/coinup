name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Point Pages UI at public Card Room API
        env:
          CR_API_URL: ${{ secrets.CR_API_URL }}
          NEXT_PUBLIC_CR_API_URL: ${{ secrets.NEXT_PUBLIC_CR_API_URL }}
          PAYMENTS_MODE: ${{ secrets.NEXT_PUBLIC_PAYMENTS_MODE }}
        run: |
          set -euo pipefail
          API="${CR_API_URL:-${NEXT_PUBLIC_CR_API_URL:-}}"
          API="${API%/}"
          MODE="${PAYMENTS_MODE:-mock}"
          if [ -z "$API" ]; then
            echo "No CR_API_URL secret — Pages Card Room stays offline for live ledger."
            exit 0
          fi
          case "$API" in
            https:*) WS="wss${API#https}/ws" ;;
            http:*)  WS="ws${API#http}/ws" ;;
            *)       WS="${API}/ws" ;;
          esac
          export API WS MODE
          node <<'NODE'
          const fs = require("fs");
          const api = process.env.API;
          const ws = process.env.WS;
          const mode = process.env.MODE || "mock";
          fs.writeFileSync(
            "public/card-room-runtime.json",
            JSON.stringify({ apiUrl: api, wsUrl: ws, paymentsMode: mode }, null, 2) + "\n",
          );
          console.log("card-room-runtime.json →", api);
          NODE
      - name: Build static export
        env:
          NEXT_PUBLIC_CR_API_URL: ${{ secrets.NEXT_PUBLIC_CR_API_URL }}
          NEXT_PUBLIC_CR_WS_URL: ${{ secrets.NEXT_PUBLIC_CR_WS_URL }}
          NEXT_PUBLIC_PAYMENTS_MODE: ${{ secrets.NEXT_PUBLIC_PAYMENTS_MODE }}
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
